[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sil-harness"
version = "1.0.0"
description = "SIL / Virtual ECU automated test harness (CANoe / Jenkins / Docker)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "SIL Automation Team" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "tenacity>=8.2",
    "httpx>=0.27",
    "click>=8.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "cmake>=3.28",
    "ninja>=1.11",
]

[project.scripts]
sil-harness = "sil_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 60
markers = [
    "integration: end-to-end harness integration tests",
]

[tool.coverage.run]
source = ["sil_harness"]
branch = true
